name: Deploy Mobi Estimates site

# Publishes the static site in mobi-estimates/ to GitHub Pages.
on:
  push:
    branches:
      - claude/frontend-design-skill-7beypw
    paths:
      - "mobi-estimates/**"
      - ".github/workflows/deploy-mobi-estimates.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./mobi-estimates

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
